name: letter_bot
volumes:
  postgres:
services:
  db:
    image: postgres:12
    command: postgres -c log_statement=all
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./bin/seed:/bin/seed
      - ./internal/infrastructure/db/postgresql/seeds:/internal/infrastructure/db/postgresql/seeds
      - ./internal/infrastructure/db/postgresql/scripts:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    env_file:
      - path: .env
        required: false
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
  bot:
    build:
      context: ../letter-bot
      dockerfile: Dockerfile.dev
    ports:
      - "3003:3003"
    volumes:
      - ./:/app
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
  # Writes the dev data (two servers, respawns, reservations) for /dev/login, then exits.
  seed:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./:/app
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "go run -buildvcs=false -tags devauth ./cmd/seed"]
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
      - "3005:3005"
    volumes:
      - ./:/app
    env_file:
      - path: .env
        required: false
    environment:
      WEB_ASSETS_DIR: /app/internal/infrastructure/web/dist
      DISCORD_INVITE_LINK: "${DISCORD_INVITE_LINK:-https://discord.gg/b7Qq8V2XFR}"
      # /dev/login (devauth build); dev-siteadmin is the site admin.
      WEB_DEV_AUTH: "true"
      WEB_ADMIN_DISCORD_IDS: "${WEB_ADMIN_DISCORD_IDS:-700000000000000004}"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >-
      sh -c "make css &&
      CompileDaemon -include=Makefile -include='*.templ' -include='*.css' -exclude-dir=.git -exclude='app.css' -exclude='*_templ.go'
      -build='make generate css build-only WEB_BUILD_TAGS=devauth' -command=./bin/letter-web"
