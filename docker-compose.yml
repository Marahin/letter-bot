name: letter_bot
volumes:
  postgres:
services:
  db:
    image: postgres:12
    command: postgres -c log_statement=all
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./bin/seed:/bin/seed
      - ./internal/infrastructure/db/postgresql/seeds:/internal/infrastructure/db/postgresql/seeds
      - ./internal/infrastructure/db/postgresql/scripts:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    env_file:
      - .env
    ports:
      - "5432:5432"
  bot:
    build:
      context: ../letter-bot
      dockerfile: Dockerfile.dev
    ports:
      - "3003:3003"
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      - db
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
      - "3005:3005"
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      WEB_ASSETS_DIR: /app/internal/infrastructure/web/dist
    depends_on:
      - db
    entrypoint: >-
      sh -c "make css &&
      CompileDaemon -include=Makefile -include='*.templ' -include='*.css' -exclude-dir=.git -exclude='app.css' -exclude='*_templ.go'
      -build='make generate css build-only' -command=./bin/letter-web"
