name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Run golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "^1.27"

      - name: Install dependencies
        run: make install-dependencies

      - name: Run lint
        run: make lint

  migrations:
    name: Run the migrations against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:12-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LETTER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "^1.27"

      - name: Run the database tests
        run: >-
          go test -race -count=1
          ./internal/infrastructure/db/postgresql/...
          ./internal/infrastructure/experience/...
          ./internal/infrastructure/stats/...

  tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "^1.27"

      - uses: sqlc-dev/setup-sqlc@v3
        with:
          sqlc-version: "1.26.0"

      - name: Install dependencies
        run: make install-dependencies

      - name: Run tests
        run: make test

  docker:
    name: Build and publish images
    runs-on: ubuntu-latest
    needs: [lint, migrations, tests]
    env:
      APP: letter-bot
      WEB_APP: letter-web
      REGISTRY: marahin
      TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: REGISTRY=${{ env.REGISTRY }} APP=${{ env.APP }} WEB_APP=${{ env.WEB_APP }} TAG=${{ env.TAG }} make docker docker-web

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: REGISTRY=${{ env.REGISTRY }} APP=${{ env.APP }} WEB_APP=${{ env.WEB_APP }} TAG=${{ env.TAG }} make push-to-registry push-web-to-registry
